[workspace]
resolver = "2"
members = [
    "crates/loom-core",
    "crates/loom-cli",

    "crates/loomd",
    "crates/loom-discovery",
    "crates/loom-event-bus",
    "crates/loom-mcp",
    "crates/loom-skills",
    "crates/loom-sessions",
    "crates/loom-auth",
    "crates/loom-hooks",
    "crates/loom-workflow",
    "crates/loom-routing",
    "crates/loom-generic-adapter",
    "crates/loom-telemetry",
    "crates/loom-ffi",
    "crates/loom-ipc",
    "crates/loom-integration-tests",
    "crates/loom-adapters",
    "crates/loom-tui",
    "crates/loom-mcp-server",
    "crates/loom-trackers",
    "crates/loom-parallel", "crates/loom-knowledge",
    "crates/loom-remote",
    "crates/loom-lsp",
    "crates/loom-debug",
    "crates/loom-hindsight",
    "crates/loom-conflict",
    "crates/loom-rules",
    "crates/loom-ast",
    "crates/loom-runtime",
    "crates/loom-review",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"
description = "Loom — The Shared Agentic Ecosystem"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.31", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
notify = "6"
comfy-table = "7"
wasm-bindgen = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
zmq = "0.10"
tempfile = "3"
chrono = { version = "0.4", features = ["clock", "std"] }
reqwest = { version = "0.12", features = ["json"] }
shellexpand = "3"
ureq = "2.12"
semver = "1"
tonic = "0.13"
prost = "0.13"
tonic-build = "0.13"
async-stream = "0.3"
tokio-stream = { version = "0.1" }
bollard = { version = "0.18", features = ["tokio-stream"] }
async-trait = "0.1"
futures-util = "0.3"
urlencoding = "2.1"
regex-lite = "0.1"
lsp-types = "0.97.0"
rand_core = { version = "0.6", features = ["getrandom"] }
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-go = "0.25.0"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
nix = { version = "0.31", features = ["process"] }


[workspace.lints.clippy]
all = "deny"
