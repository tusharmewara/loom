[package]
name = "loomd"
version.workspace = true
edition.workspace = true

[features]
docker = ["loom-runtime/docker"]
podman = ["loom-runtime/podman"]
kubernetes = ["loom-runtime/kubernetes"]
containers = ["loom-runtime/containers"]
mcp-control-plane = []

[dependencies]
loom-core = { path = "../loom-core" }
loom-discovery = { path = "../loom-discovery" }
loom-event-bus = { path = "../loom-event-bus" }
loom-mcp = { path = "../loom-mcp" }
loom-skills = { path = "../loom-skills" }
loom-sessions = { path = "../loom-sessions" }
loom-auth = { path = "../loom-auth" }
loom-hooks = { path = "../loom-hooks" }
loom-telemetry = { path = "../loom-telemetry" }
loom-ipc = { path = "../loom-ipc" }
loom-adapters = { path = "../loom-adapters" }
loom-generic-adapter = { path = "../loom-generic-adapter" }
loom-knowledge = { path = "../loom-knowledge" }
loom-runtime = { path = "../loom-runtime" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
tracing.workspace = true
toml.workspace = true
uuid.workspace = true
chrono.workspace = true

# gRPC
tonic = { workspace = true, features = ["transport", "tls-webpki-roots"] }
prost.workspace = true
async-stream.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }

loom-workflow = { path = "../loom-workflow" }

[dev-dependencies]
tempfile.workspace = true
loom-ipc = { path = "../loom-ipc" }
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
tonic-build = { workspace = true }

[lints]
workspace = true

# prost is used by tonic-generated code pulled in via include!(env!("OUT_DIR")),
# invisible to cargo-machete's source scan.
[package.metadata.cargo-machete]
ignored = ["prost"]
