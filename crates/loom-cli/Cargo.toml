[package]
name = "loom"
version.workspace = true
edition.workspace = true

[lib]
name = "loom_cli"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-core = { path = "../loom-core" }
loom-discovery = { path = "../loom-discovery" }
loom-event-bus = { path = "../loom-event-bus" }
loom-generic-adapter = { path = "../loom-generic-adapter" }
loom-ipc = { path = "../loom-ipc" }
loom-routing = { path = "../loom-routing" }
loom-sessions = { path = "../loom-sessions" }
loom-auth = { path = "../loom-auth" }
loom-skills = { path = "../loom-skills" }
loom-workflow = { path = "../loom-workflow" }
loom-hooks = { path = "../loom-hooks" }
loom-mcp = { path = "../loom-mcp" }
loom-adapters = { path = "../loom-adapters" }
loom-mcp-server = { path = "../loom-mcp-server" }
loom-trackers = { path = "../loom-trackers" }
loom-parallel = { path = "../loom-parallel" }
loom-knowledge = { path = "../loom-knowledge" }
loom-remote = { path = "../loom-remote" }
loom-lsp = { path = "../loom-lsp" }
loom-hindsight = { path = "../loom-hindsight" }
loom-rules = { path = "../loom-rules" }
loom-conflict = { path = "../loom-conflict" }
loom-ast = { path = "../loom-ast" }
loom-runtime = { path = "../loom-runtime" }
loom-tui = { path = "../loom-tui", optional = true }
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
ureq.workspace = true
lsp-types = "0.97.0"
loom-debug = { path = "../loom-debug" }

[features]
default = ["tui"]
tui = ["loom-tui"]
docker = ["loom-runtime/docker"]
podman = ["loom-runtime/podman"]
kubernetes = ["loom-runtime/kubernetes"]
containers = ["loom-runtime/containers"]

[dev-dependencies]
tempfile.workspace = true
