[package]
name = "loom"
version.workspace = true
edition.workspace = true

[lib]
name = "loom_cli"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-core = { path = "../loom-core" }
loom-discovery = { path = "../loom-discovery" }
loom-event-bus = { path = "../loom-event-bus" }
loom-generic-adapter = { path = "../loom-generic-adapter" }
loom-ipc = { path = "../loom-ipc" }
loom-routing = { path = "../loom-routing" }
loom-sessions = { path = "../loom-sessions" }
loom-auth = { path = "../loom-auth" }
loom-skills = { path = "../loom-skills" }
loom-workflow = { path = "../loom-workflow" }
loom-hooks = { path = "../loom-hooks" }
loom-mcp = { path = "../loom-mcp" }
loom-adapters = { path = "../loom-adapters" }
loom-mcp-server = { path = "../loom-mcp-server" }
loom-trackers = { path = "../loom-trackers" }
loom-parallel = { path = "../loom-parallel" }
loom-tui = { path = "../loom-tui", optional = true }
clap.workspace = true
comfy-table.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
sha2.workspace = true

[features]
default = ["tui"]
tui = ["loom-tui"]

[dev-dependencies]
tempfile.workspace = true
