[package]
name = "loom-runtime"
version.workspace = true
edition.workspace = true
description = "Pluggable runtime backends for Loom task execution (process, Docker, Podman, Kubernetes)"

[dependencies]
loom-core = { path = "../loom-core" }
loom-telemetry = { path = "../loom-telemetry" }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tempfile = "3.8"

# Docker support via bollard
bollard = { version = "0.18", optional = true, features = ["tokio-stream"] }
futures-util = { version = "0.3", optional = true }

# Kubernetes support via kube-rs client library
kube = { version = "0.95", optional = true, features = ["client", "derive", "runtime", "config"] }
k8s-openapi = { version = "0.23", optional = true, features = ["v1_30"] }
kube-client = { version = "0.95", optional = true }
kube-runtime = { version = "0.95", optional = true }
kube-derive = { version = "0.95", optional = true }

[features]
default = ["process"]
process = []
docker = ["bollard", "futures-util"]
podman = []
kubernetes = ["kube", "kube-client", "k8s-openapi", "kube-runtime", "kube-derive"]
containers = ["docker", "podman", "kubernetes"]
