[package]
name = "loom-workflow"
version.workspace = true
edition.workspace = true

[dependencies]
loom-core = { path = "../loom-core" }
loom-discovery = { path = "../loom-discovery" }
loom-mcp = { path = "../loom-mcp" }
loom-skills = { path = "../loom-skills" }
loom-sessions = { path = "../loom-sessions" }
loom-event-bus = { path = "../loom-event-bus" }
loom-routing = { path = "../loom-routing" }
loom-runtime = { path = "../loom-runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tempfile = "3.8"
toml = { workspace = true }
shellexpand = "0.1"
dirs = "5.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
