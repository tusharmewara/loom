[package]
name = "loom-workflow"
version.workspace = true
edition.workspace = true

[dependencies]
loom-core = { path = "../loom-core" }
loom-sessions = { path = "../loom-sessions" }
loom-routing = { path = "../loom-routing" }
loom-runtime = { path = "../loom-runtime" }
loom-adapters = { path = "../loom-adapters" }
loom-generic-adapter = { path = "../loom-generic-adapter" }
loom-hooks = { path = "../loom-hooks" }
loom-knowledge = { path = "../loom-knowledge" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
shellexpand = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
urlencoding = { workspace = true }

[features]
docker = ["loom-runtime/docker"]
podman = ["loom-runtime/podman"]
kubernetes = ["loom-runtime/kubernetes"]
containers = ["docker", "podman", "kubernetes"]

[lints]
workspace = true
