[package]
name = "loom-tui"
version.workspace = true
edition.workspace = true

[lib]
name = "loom_tui"
path = "src/lib.rs"

[[bin]]
name = "loom-tui"
path = "src/main.rs"

[features]
docker = ["loom-runtime/docker"]
podman = ["loom-runtime/podman"]
kubernetes = ["loom-runtime/kubernetes"]
containers = ["loom-runtime/containers"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
loom-core = { path = "../loom-core" }
loom-runtime = { path = "../loom-runtime" }
loom-generic-adapter = { path = "../loom-generic-adapter" }
ratatui.workspace = true
crossterm.workspace = true
nix = { workspace = true, optional = true }
chrono = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
