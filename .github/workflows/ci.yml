name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - feature: "unit-tests"
            name: "Unit & Integration Tests"
            test_cmd: "cargo test --workspace --exclude loom-tui"
            coverage: true
          - feature: "clippy"
            name: "Clippy Linting"
            test_cmd: "cargo clippy --workspace --all-targets --all-features -- -D warnings"
            coverage: false
          - feature: "doc-tests"
            name: "Documentation Tests"
            test_cmd: "cargo test --workspace --doc"
            coverage: false

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      # loomd's build.rs (tonic/prost gRPC codegen) requires protoc
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Cache Cargo Registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo Build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Run Tests
        if: matrix.feature == 'unit-tests'
        run: |
          set -o pipefail
          cargo test --workspace --exclude loom-tui --all-features 2>&1 | tee test-output.log
          # Upload test summary for analysis
          if [ -f test-output.log ]; then
            echo "Tests completed, see log for details"
          fi

      - name: Run Clippy
        if: matrix.feature == 'clippy'
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy-output.log

      - name: Run Doc Tests
        if: matrix.feature == 'doc-tests'
        run: |
          set -o pipefail
          cargo test --workspace --doc --all-features 2>&1 | tee doc-output.log

      - name: Install cargo-tarpaulin (coverage)
        if: matrix.coverage == true
        run: cargo install cargo-tarpaulin 2>&1 | tail -5

      - name: Generate Coverage Report
        if: matrix.coverage == true
        run: |
          cargo tarpaulin --workspace --output-type lcov --skip-open 2>&1 | tail -10 || echo "Coverage generation had issues, continuing..."
          # Note: tarpaulin may have issues with workspace - ensure coverage is collected

  # ===== Container Runtime =====
  # The container path is a first-class, CI-tested path (PILLAR 2). The
  # network posture policy is pure logic and runs in the `test` job; this job
  # runs the end-to-end container smoke test against the runner's Docker.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-container-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify Docker is present
        run: docker version

      - name: Build egress proxy image
        # The restricted-posture smoke needs the proxy sidecar's image; the
        # crate is standalone, so this is a self-contained build.
        run: docker build -t loom-egress-proxy:latest crates/loom-egress-proxy

      - name: Run container smoke test
        env:
          LOOM_CONTAINER_SMOKE: "1"
          LOOM_EGRESS_PROXY_IMAGE: loom-egress-proxy:latest
        run: |
          set -o pipefail
          cargo test -p loom-runtime --features docker --test container_smoke -- --nocapture 2>&1 | tee container-smoke-output.log
          # The smoke test must have actually run, not skipped: this job
          # exists to prove the container path works against a real engine.
          if grep -q "skipped:" container-smoke-output.log; then
            echo "::error::container smoke test skipped on a runner with Docker present"
            exit 1
          fi
          # Same bar for the egress path specifically — the restricted
          # posture smoke must never silently skip in CI.
          grep -q "ALLOWED:200" container-smoke-output.log
          grep -q "DENIED:OK" container-smoke-output.log

      - name: Upload Container Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-test-results-${{ runner.os }}
          path: container-smoke-output.log

  # ===== Integration Tests =====
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      # loomd's build.rs (tonic/prost gRPC codegen) requires protoc
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-integration-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with all features
        run: cargo build --workspace --all-features

      - name: Run Integration Tests
        run: |
          # Run integration test script if it exists
          if [ -d tests/integration ]; then
            chmod +x tests/integration/run_integration_test.sh
            ./tests/integration/run_integration_test.sh 2>&1 | tee integration-output.log || echo "Integration tests completed with issues"
          else
            echo "No integration test directory found, running basic cross-tool tests"
            # Run a basic cross-tool test
            cargo test --workspace --exclude loom-tui -- --test-threads=4 2>&1 | tee basic-test-output.log
          fi

      - name: Publish Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-${{ runner.os }}
          path: |
            test-output.log
            clippy-output.log
            doc-output.log
            integration-output.log
            basic-test-output.log

  # ===== Benchmarks =====
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Run Performance Benchmarks
        run: |
          # Run benchmarks on critical paths
          cargo bench --workspace --all-features 2>&1 | tee benchmark-output.log || echo "Benchmarks execution had issues"

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-results-${{ runner.os }}
          path: benchmark-output.log

  # ===== Security Audit =====
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Run Cargo Auditable
        run: cargo install cargo-audit && cargo audit 2>&1 | tee security-output.log || echo "Security audit completed"

      - name: Check for Vulnerabilities
        run: |
          # Check for known vulnerabilities in dependencies
          cargo audit --advisory 2>&1 | tail -20

      - name: Upload Security Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-results-${{ runner.os }}
          path: security-output.log