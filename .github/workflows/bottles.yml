name: Build and Publish Bottles

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-bottles:
    runs-on: macos-14
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - target: aarch64-apple-darwin
            platform: arm64_sequoia
          - target: aarch64-apple-darwin
            platform: arm64_sonoma
          - target: x86_64-apple-darwin
            platform: ventura
          - target: x86_64-apple-darwin
            platform: monterey

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine version
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          cargo build --release --bins -p loom -p loomd --target ${{ matrix.target }}
          mkdir -p bottle/loom/bin
          cp "target/${{ matrix.target }}/release/loom" "target/${{ matrix.target }}/release/loomd" bottle/loom/bin/

      - name: Create bottle tarball
        run: |
          tar -czf "loom-${{ steps.vars.outputs.version }}.${{ matrix.platform }}.bottle.tar.gz" -C bottle loom

      - name: Compute checksums
        id: checksum
        run: |
          TARBALL="loom-${{ steps.vars.outputs.version }}.${{ matrix.platform }}.bottle.tar.gz"
          echo "sha256=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Wait for release to be ready
        run: sleep 30

      - name: Upload bottle asset
        uses: softprops/action-gh-release@v3
        with:
          files: "loom-${{ steps.vars.outputs.version }}.${{ matrix.platform }}.bottle.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save checksum
        run: |
          echo "${{ matrix.platform }}=${{ steps.checksum.outputs.sha256 }}" > checksum-${{ matrix.platform }}.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.platform }}
          path: checksum-${{ matrix.platform }}.txt

  publish-bottles:
    needs: build-bottles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download tarballs from release
        run: |
          gh release download v${{ steps.vars.outputs.version }} \
            --pattern "loom-*.bottle.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bottles to homebrew-loom
        run: |
          for tarball in loom-*.bottle.tar.gz; do
            echo "Uploading $tarball..."
            gh release upload v${{ steps.vars.outputs.version }} \
              "$tarball" \
              --repo tusharmewara/homebrew-loom --clobber || \
            gh release create v${{ steps.vars.outputs.version }} \
              --repo tusharmewara/homebrew-loom \
              --generate-notes \
              "$tarball"
          done
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_LOOM_PAT }}
