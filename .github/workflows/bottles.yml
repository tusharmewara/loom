name: Build and Publish Bottles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.3.0). Leave empty to use Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets:
            - aarch64-apple-darwin
            - x86_64-apple-darwin

      - name: Test
        run: echo "test"
