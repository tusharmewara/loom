name: Build and Publish Bottles

'on':
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.3.0). Leave empty to use Cargo.toml."
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-14
    outputs:
      codename: ${{ steps.os_version.outputs.codename }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets:
            - aarch64-apple-darwin
            - x86_64-apple-darwin

      - name: Extract version
        id: extract_version
        run: |
          VERSION_INPUT="${{ github.event.inputs.version || github.ref_name }}"
          V=$(echo "$VERSION_INPUT" | sed 's/^v//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: v$V"

      - name: Build ARM64 binaries (native)
        env:
          V: ${{ steps.extract_version.outputs.version }}
        run: |
          cargo build --release --bins -p loom -p loomd --target aarch64-apple-darwin
          mkdir -p bottle-arm64/{loom/"$V"/bin}
          cp target/aarch64-apple-darwin/release/loom \
             target/aarch64-apple-darwin/release/loomd \
             bottle-arm64/loom/"$V"/bin/

      - name: Build x86_64 binaries (cross-compiled)
        env:
          V: ${{ steps.extract_version.outputs.version }}
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: /usr/bin/clang
        run: |
          cargo build --release --bins -p loom -p loomd --target x86_64-apple-darwin
          mkdir -p bottle-x86/{loom/"$V"/bin}
          cp target/x86_64-apple-darwin/release/loom \
             target/x86_64-apple-darwin/release/loomd \
             bottle-x86/loom/"$V"/bin/

      - name: Detect macOS version codename
        id: os_version
        run: |
          PRODUCT_VERSION=$(sw_vers -productVersion)
          MAJOR_VERSION=$(echo "$PRODUCT_VERSION" | cut -d. -f1)
          case "$MAJOR_VERSION" in
            13) CODENAME="ventura" ;;
            14) CODENAME="sonoma"  ;;
            15) CODENAME="sequoia" ;;
            26) CODENAME="tahoe"   ;;
            *)  CODENAME="tahoe"   ;;
          esac
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"
          echo "Detected macOS $PRODUCT_VERSION (codename: $CODENAME)"

      - name: Create macOS bottles
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CODENAME: ${{ steps.os_version.outputs.codename }}
        run: |
          V=$(echo "$VERSION" | sed 's/^v//')
          echo "Building bottles for v$V ($CODENAME)..."

          # ARM bottle (from arm64 binaries)
          tar -czf "loom-${V}.arm64_${CODENAME}.bottle.tar.gz" -C bottle-arm64 loom
          echo "BOTTLE_ARM_SHA=$(shasum -a 256 "loom-${V}.arm64_${CODENAME}.bottle.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

          # Intel bottle (from x86_64 binaries)
          tar -czf "loom-${V}.${CODENAME}.bottle.tar.gz" -C bottle-x86 loom
          echo "BOTTLE_INTEL_SHA=$(shasum -a 256 "loom-${V}.${CODENAME}.bottle.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

          echo "Created:"
          ls -lh *.bottle.tar.gz

      - name: Upload macOS bottles to loom release
        uses: softprops/action-gh-release@v3
        with:
          files: loom-*.bottle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev

      - name: Extract version
        id: extract_version
        run: |
          VERSION_INPUT="${{ github.event.inputs.version || github.ref_name }}"
          V=$(echo "$VERSION_INPUT" | sed 's/^v//')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: v$V"

      - name: Build Linux x86_64 binaries
        env:
          V: ${{ steps.extract_version.outputs.version }}
        run: |
          cargo build --release --bins -p loom -p loomd
          mkdir -p bottle-linux/{loom/"$V"/bin}
          cp target/release/loom target/release/loomd bottle-linux/loom/"$V"/bin/

      - name: Create Linux bottle
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          V=$(echo "$VERSION" | sed 's/^v//')
          tar -czf "loom-${V}.x86_64_linux.bottle.tar.gz" -C bottle-linux loom
          echo "BOTTLE_LINUX_SHA=$(shasum -a 256 "loom-${V}.x86_64_linux.bottle.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Created:"
          ls -lh *.bottle.tar.gz

      - name: Upload Linux bottle to loom release
        uses: softprops/action-gh-release@v3
        with:
          files: loom-*.bottle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all bottles from release
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(echo "$VERSION" | sed 's/^v//')
          gh release download "$VERSION" \
            -R "${{ github.repository }}" \
            -p "loom-*.bottle.tar.gz" \
            -D /tmp/bottles
          ls -la /tmp/bottles/

      - name: Compute source tarball SHA
        id: source_sha
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL -o /tmp/source.tar.gz \
            "https://github.com/${{ github.repository }}/archive/refs/tags/$VERSION.tar.gz"
          SRC_SHA=$(shasum -a 256 /tmp/source.tar.gz | cut -d' ' -f1)
          echo "sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $SRC_SHA"

      - name: Publish to Homebrew tap
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          GH_TOKEN: ${{ secrets.HOMEBREW_LOOM_PAT }}
        run: |
          V=$(echo "$VERSION" | sed 's/^v//')

          # Create/update Homebrew release
          echo "Creating Homebrew release..."
          gh release create "$VERSION" \
            --repo tusharmewara/homebrew-loom \
            --title "Loom $VERSION Bottles" \
            --notes "Bottles for Loom v$VERSION (macOS + Linux)" \
            --clobber || true

          # Upload bottles
          echo "Uploading bottles to Homebrew..."
          gh release upload "$VERSION" \
            --repo tusharmewara/homebrew-loom \
            /tmp/bottles/loom-*.bottle.tar.gz \
            --clobber

          # Clone and update formula
          echo "Updating Homebrew formula..."
          git clone https://github.com/tusharmewara/homebrew-loom.git /tmp/homebrew-loom-update
          cd /tmp/homebrew-loom-update

          # Compute bottle SHAs
          BOTTLE_ENTRIES=""
          for f in /tmp/bottles/loom-*.bottle.tar.gz; do
            BASENAME=$(basename "$f")
            # Parse: loom-VERSION.TAG.bottle.tar.gz
            TAG="${BASENAME#loom-*.}"
            TAG="${TAG%.bottle.tar.gz}"
            SHA=$(shasum -a 256 "$f" | cut -d' ' -f1)
            case "$TAG" in
              x86_64_linux)
                BOTTLE_ENTRIES+="    sha256 cellar: :any_skip_relocation, x86_64_linux: \"$SHA\"\n"
                ;;
              *)
                BOTTLE_ENTRIES+="    sha256 cellar: :any, ${TAG}: \"$SHA\"\n"
                ;;
            esac
          done

          # Generate formula
          cat > Formula/loom.rb << 'FORMULA'
          class Loom < Formula
            desc "Unified agentic ecosystem for sharing skills, sessions, and MCP servers"
            homepage "https://github.com/tusharmewara/loom"
            version "${V}"
            license "MIT"

            url "https://github.com/tusharmewara/loom/archive/refs/tags/v${V}.tar.gz"
            sha256 "${SRC_SHA}"

            bottle do
              root_url "https://github.com/tusharmewara/homebrew-loom/releases/download/v${V}"
          $(echo -e "$BOTTLE_ENTRIES")  end

            depends_on "rust" => :build

            def install
              bin.install "bin/loom"
              bin.install "bin/loomd"
            end

            service do
              run [opt_bin/"loomd"]
              working_dir Dir.home
              keep_alive true
            end

            test do
              assert_match "Loom", shell_output("\#{bin}/loom --help")
            end
          end
          FORMULA

          # Fix indentation
          sed -i 's/^          //' Formula/loom.rb

          git config user.name "Loom Bot"
          git config user.email "bot@loom.sh"
          git add -A
          git commit -m "Loom v$V" --allow-empty

          # Check if we can push (only if PAT is available)
          if [[ -n "${GH_TOKEN:-}" && "$GH_TOKEN" != "NONE" ]]; then
            git push
          else
            echo "HOMEBREW_LOOM_PAT not set -- skipping push."
            echo "Formula generated at: Formula/loom.rb"
            cat Formula/loom.rb
          fi
